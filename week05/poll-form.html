<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <H1>WDD 130 | HTML Forms - User Poll</H1>
    </header>


    <main>
        <form action="">
            <label for="fullname"> Full Name</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="usermail">Email:</label>
            <input type="email" id="usermail" name="usermail" required>
            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            <label for="browser">What is your favorite internet browser</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="brave">Brave</option>
                <option value="edge">Edge</option>
                <option value="other">Other</option>
            </select>
            <label for="pet">Do you have a household pet</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the place you have lived</label>
            <textarea name="feedback" id="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali, Tana Mada"></textarea>
            <button type="submit">Submit Poll</button>

        </form>
    </main>


    <footer>
        <p><em>&copy;| HTML Form - User Poll Activity | Mahandrisoa Razafintsalama </em></p>

    </footer>
</body>

</html>
